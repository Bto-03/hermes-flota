name: flota
label: Flota
kind: standalone
version: 0.2.1
author: Francisco Bastidas
description: >
  Run delegate_task subagents on your own machines over SSH
  (delegation.backend: flota). Flota wakes the chosen machine if it is
  asleep (Wake-on-LAN, a relay host on its LAN, a command such as a smart
  plug, or the machine's own wake timer), runs the work there and puts it
  back to sleep after its last subagent, never while it is busy. It powers
  off only machines it can wake again. Pair machines with one-time codes,
  see the fleet on the Flota page of Hermes Desktop, and check everything
  with `hermes flota doctor`. Python standard library only.
requires_hermes: ">=0.22.5"
provides_tools: [flota]
provides_hooks: [subagent_start, subagent_stop]
config_schema:
  auto_sleep:
    type: bool
    label: Auto-sleep
    description: Put machines back to sleep after their last subagent.
    default: true
  sleep_after:
    type: str
    label: Sleep after
    description: Idle time before auto-sleep (e.g. 10m, 1h), for machines that do not set their own sleep_after.
    default: 10m
  sleep_action:
    type: str
    choices: [suspend, hibernate, poweroff]
    label: Sleep action
    description: What auto-sleep does, for machines that do not set their own sleep.
    default: suspend
  allow_power_off:
    type: bool
    label: Allow power off
    description: Allow powering off machines that Flota can wake again (Wake-on-LAN or a wake command). Machines without a wake method can only be suspended.
    default: true
  agent_tool:
    type: bool
    label: Agent tool
    description: Give the agent the flota tool to check, wake, suspend or power off your machines.
    default: true
  cache_ttl:
    type: str
    label: Prompt cache lifetime
    description: How long the provider's prompt cache lives, quoted when the agent is told to replace a silent subagent instead of reviving it.
    default: 5m
  machines:
    type: dict
    label: Machines
    description: Your machines by name (profile, host, wake, mac, ...); `hermes flota setup` fills it.
    default: {}
